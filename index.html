<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Website</title>
  <meta name="description" content="My GitHub Pages website">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav>
      <a class="logo" href="#">MySite</a>

      <div class="nav-links">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <section id="home" class="hero">
      <h1>Welcome to my website</h1>
      <p>A simple website hosted for free with GitHub Pages.</p>
      <a class="button" href="#about">Learn More</a>
    </section>

    <section id="about">
      <h2>About</h2>
      <p>
        Replace this text with information about yourself,
        your project, or your business.
      </p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Add your contact information or social links here.</p>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> MySite</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
